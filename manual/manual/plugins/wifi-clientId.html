<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Client Id</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            height: 100vh; /* 使容器占满全屏高度 */
            margin: 0px; /* 设置边距 */
            flex-direction: column; /* 垂直排列 */
        }
        .input-group {
            display: flex;
            align-items: center; /* 垂直居中对齐输入框和按钮 */
            margin-bottom: 20px; /* 输入框间距 */
            gap: 10px; /* 输入框和按钮之间的间距 */
        }
        #qrcode {
            margin: 20px;
            padding: 20px; /* 添加白边 */
            background-color: white; /* 白边背景 */
            display: inline-block; /* 使容器适应内容大小 */
            border-radius: 10px; /* 可选：使边角圆润 */
        }
        input {
            padding: 10px;
            width: 300px;
            margin-top: 5px; /* 标签与输入框之间的间距 */
        }
        label {
            max-width: 300px; /* 设置标签最大宽度 */
            word-wrap: break-word; /* 自动换行 */
            margin-bottom: 5px; /* 标签与输入框之间的间距 */
            display: block; /* 让标签独占一行 */
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="input-group">
        <label for="inputText">Client ID</label>
        <input type="text" id="inputText" placeholder="Client ID">
        <button id="generateBtn">生成二维码</button>
    </div>
    <div id="qrcode"></div>
    <script>
        function generateCodes(text) {
            // 清空旧的二维码
            $("#qrcode").empty();
            if(text)
            {
                var cmd="%IOTCLIID#"+text+"#";
                // 生成二维码
                $("#qrcode").qrcode({
                    text: cmd,
                    width: 256,
                    height: 256
                });
            }
        }

        $(document).ready(function() {
            // 默认输入框为空
            var defaultText = "";
            $("#inputText").val(defaultText);

            // 点击按钮生成二维码
            $("#generateBtn").click(function() {
                var inputText = $("#inputText").val();
                generateCodes(inputText);
            });
        });
    </script>
</body>
</html>
