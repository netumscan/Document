<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Client Id</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            height: 100vh; /* 使容器占满全屏高度 */
            margin: 0px; /* 设置边距 */
            flex-direction: column; /* 垂直排列 */
        }
        .input-container {
            margin-bottom: 20px; /* 与二维码区域的间距 */
            width: fit-content; /* 适配内容宽度 */
        }
        .input-group {
            display: flex;
            align-items: stretch; /* 让子元素高度拉伸一致 */
            gap: 10px; /* 输入框和按钮之间的间距 */
        }
        #qrcode {
            margin: 20px;
            padding: 20px; /* 添加白边 */
            background-color: white; /* 白边背景 */
            display: inline-block; /* 使容器适应内容大小 */
            border-radius: 10px; /* 可选：使边角圆润 */
        }
        input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc; /* 补全输入框边框，视觉更统一 */
            border-radius: 4px; /* 和按钮圆角一致 */
            box-sizing: border-box; /* 内边距计入宽度/高度，保证高度计算准确 */
        }
        label {
            max-width: 300px; /* 设置标签最大宽度 */
            word-wrap: break-word; /* 自动换行 */
            margin-bottom: 5px; /* 标签与输入框之间的间距 */
            display: block; /* 让标签独占一行 */
            text-align: left; /* 左对齐 */
            font-size: 14px;
            color: #333;
        }
        button {
            padding: 0 20px; /* 去掉上下内边距，靠align-items: stretch撑高 */
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            box-sizing: border-box; /* 保证盒模型统一 */
            font-size: 14px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="input-container">
        <label for="inputText">Client ID</label>
        <div class="input-group">
            <input type="text" id="inputText" placeholder="Client ID">
            <button id="generateBtn">生成</button>
        </div>
    </div>
    <div id="qrcode"></div>
    <script>
        function generateCodes(text) {
            // 清空旧的二维码
            $("#qrcode").empty();
            if(text)
            {
                var cmd="%IOTCLIID#"+text+"#";
                // 生成二维码
                $("#qrcode").qrcode({
                    text: cmd,
                    width: 256,
                    height: 256
                });
            }
        }

        $(document).ready(function() {
            // 默认输入框为空
            var defaultText = "";
            $("#inputText").val(defaultText);

            // 点击按钮生成二维码
            $("#generateBtn").click(function() {
                var inputText = $("#inputText").val();
                generateCodes(inputText);
            });

            // 监听输入框内容变化，清除二维码
            $("#inputText").on('input change', function() {
                $("#qrcode").empty(); // 清空二维码容器
            });
        });
    </script>
</body>
</html>
