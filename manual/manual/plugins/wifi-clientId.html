<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Client Id</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            height: 100vh; /* 使容器占满全屏高度 */
            margin: 0px; /* 设置边距 */
            flex-direction: column; /* 垂直排列 */
        }
        .input-group {
            display: flex;
            flex-direction: column; /* 垂直排列标签和输入框 */
            align-items: flex-start; /* 左对齐 */
            margin-bottom: 12px; /* 输入框与按钮间距 */
        }
        #qrcode {
            margin: 20px;
            padding: 20px; /* 添加白边 */
            background-color: white; /* 白边背景 */
            display: inline-block; /* 使容器适应内容大小 */
            border-radius: 10px; /* 可选：使边角圆润 */
        }
        input {
            padding: 10px;
            width: 300px;
            margin-top: 5px; /* 标签与输入框之间的间距 */
        }
        label {
            max-width: 300px; /* 设置标签最大宽度 */
            word-wrap: break-word; /* 自动换行 */
            margin-bottom: 5px; /* 标签与输入框之间的间距 */
        }
        button {
            padding: 10px;
            width: 322px; /* 与输入框视觉对齐（300 + padding）可按需调整 */
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="input-group">
        <label for="inputText">Client ID</label>
        <input type="text" id="inputText" placeholder="Client ID">
        <button type="button" id="btnGenerate">Generate</button>
    </div>

    <div id="qrcode"></div>

    <script>
        function generateCodes(text) {
            // 清空旧的二维码
            $("#qrcode").empty();
            if(text)
            {
				var cmd = "%IOTCLIID#" + text + "#";
				// 生成二维码
				$("#qrcode").qrcode({
					text: cmd,
					width: 256,
					height: 256
				});
            }
        }

        $(document).ready(function() {
            // 默认生成
            var defaultText = "";
            $("#inputText").val(defaultText);
            generateCodes(defaultText);


            // 点击按钮生成
            $("#btnGenerate").on("click", function() {
                var inputText = $("#inputText").val();
                generateCodes(inputText);
            });
            
            // 监听输入框的变化：仅清空二维码，不生成
            $("#inputText").on("input", function() {
                $("#qrcode").empty();
            });

            // 可选：按回车也生成
            $("#inputText").on("keydown", function(e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    $("#btnGenerate").click();
                }
            });
        });
    </script>
</body>
</html>
